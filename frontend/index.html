<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>VoltKart Assistant</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<style>
*{box-sizing:border-box} body{margin:0;font:14px system-ui,sans-serif;display:flex;height:100vh;color:#222}
#side{width:260px;background:#f4f4f6;padding:12px;overflow:auto;border-right:1px solid #ddd}
#main{flex:1;display:flex;flex-direction:column;min-width:0}
#msgs{flex:1;overflow:auto;padding:16px}
.m{max-width:820px;margin:0 auto 16px} .u{background:#e8f0fe;padding:10px 14px;border-radius:10px;white-space:pre-wrap}
.a{padding:4px 2px} .ts{font-size:11px;color:#888;margin-bottom:3px}
table{border-collapse:collapse;margin:6px 0} td,th{border:1px solid #ccc;padding:4px 8px}
.cite{background:#dbe7ff;border-radius:4px;padding:0 4px;font-size:10px}
.cites{margin-top:8px;font-size:12px;border-top:1px dashed #ccc;padding-top:6px}
.cites pre{background:#272822;color:#eee;padding:8px;overflow:auto;border-radius:6px;font-size:11px}
details{margin:3px 0}
#bar{display:flex;gap:8px;padding:12px;border-top:1px solid #ddd}
#inp{flex:1;padding:10px;border:1px solid #bbb;border-radius:8px;font:inherit}
button{padding:8px 12px;border:0;border-radius:8px;background:#2b5cff;color:#fff;cursor:pointer}
button.g{background:#fff;color:#222;border:1px solid #bbb}
.chat{padding:6px 8px;border-radius:6px;cursor:pointer;margin:2px 0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.chat.on{background:#dbe7ff} h4{margin:14px 0 6px} .f{font-size:12px;margin:3px 0}
#top{display:flex;justify-content:flex-end;padding:8px 12px;border-bottom:1px solid #eee}
</style></head><body>
<div id="side">
  <button onclick="newChat()" style="width:100%">+ New chat</button>
  <h4>Chats</h4><div id="chats"></div>
  <h4>Files</h4><div id="files"></div>
  <input type="file" id="fi" multiple accept=".csv,.pdf,.docx,.txt,.md" style="display:none" onchange="upload(this.files)">
  <button class="g" style="width:100%;margin-top:8px" onclick="fi.click()">Upload files</button>
  <div id="upmsg" class="f"></div>
</div>
<div id="main">
  <div id="top"><button class="g" onclick="exportPdf()">Export chat as PDF</button></div>
  <div id="msgs"></div>
  <div id="bar"><textarea id="inp" rows="2" placeholder="Ask about your tables and documents..."></textarea><button id="send" onclick="send()">Send</button></div>
</div>
<script>
let cid=null; const $=id=>document.getElementById(id); const charts=[];
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
async function api(u,o){const r=await fetch(u,o); if(!r.ok){let t=await r.text(); try{t=JSON.parse(t).detail}catch(e){} throw new Error(t)} return r.json()}
async function loadChats(){const cs=await api('/api/chats'); $('chats').innerHTML=cs.map(c=>`<div class="chat ${c.id===cid?'on':''}" onclick="openChat(${c.id})">${esc(c.title)}</div>`).join('')}
async function loadFiles(){const fs=await api('/api/files'); $('files').innerHTML=fs.map(f=>`<div class="f">${f.kind==='table'?'📊':'📄'} ${esc(f.name)}<br><small>${esc(f.detail)}</small></div>`).join('')||'<div class="f">none yet</div>'}
async function newChat(){const r=await api('/api/chats',{method:'POST'}); await openChat(r.id)}
async function openChat(id){cid=id; $('msgs').innerHTML=''; (await api(`/api/chats/${id}/messages`)).forEach(render); await loadChats(); scroll()}
function scroll(){$('msgs').scrollTop=1e9}
function render(m){
  const d=document.createElement('div'); d.className='m'; const t=new Date(m.ts*1000).toLocaleString();
  if(m.role==='user'){d.innerHTML=`<div class="ts">You · ${t}</div><div class="u">${esc(m.content)}</div>`}
  else{
    const md=m.content.replace(/\[([TD]\d+)\]/g,'<sup class="cite">$1</sup>');
    let h=`<div class="ts">Assistant · ${t}</div><div class="a">${DOMPurify.sanitize(marked.parse(md))}</div>`;
    if(m.chart){const id='ch'+Math.random().toString(36).slice(2); h+=`<div style="max-width:560px"><canvas id="${id}"></canvas></div>`; setTimeout(()=>drawChart(id,m.chart),0)}
    if(m.citations&&m.citations.length){h+='<div class="cites"><b>Citations</b>'+m.citations.map(c=>c.type==='document'
      ?`<details><summary><span class="cite">${c.id}</span> ${esc(c.file)} · dated ${esc(c.date)} · ${esc(c.location)}</summary><pre>${esc(c.text)}</pre></details>`
      :`<details><summary><span class="cite">${c.id}</span> Table(s): ${esc(c.tables.join(', '))} — view query &amp; result</summary><pre>${esc(c.code)}</pre><pre>${esc(c.result)}</pre></details>`).join('')+'</div>'}
    d.innerHTML=h}
  $('msgs').appendChild(d)}
function drawChart(id,c){new Chart($(id),{type:c.type,data:{labels:c.labels,datasets:[{label:c.y_label,data:c.values}]},
  options:{plugins:{title:{display:true,text:c.title}},scales:c.type==='pie'?{}:{x:{title:{display:true,text:c.x_label}},y:{title:{display:true,text:c.y_label}}}}})}
async function send(){
  const q=$('inp').value.trim(); if(!q) return; if(!cid) await newChat();
  $('inp').value=''; $('send').disabled=true;
  render({role:'user',content:q,ts:Date.now()/1000});
  const w=document.createElement('div'); w.className='m a'; w.textContent='Thinking…'; $('msgs').appendChild(w); scroll();
  try{const m=await api(`/api/chats/${cid}/messages`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({content:q})}); w.remove(); render(m); loadChats()}
  catch(e){w.textContent='Error: '+e.message}
  $('send').disabled=false; scroll()}
async function upload(files){
  const fd=new FormData(); for(const f of files) fd.append('files',f);
  $('upmsg').textContent='Uploading…';
  try{const r=await api('/api/files',{method:'POST',body:fd}); $('upmsg').textContent=r.errors.length?r.errors.join('; '):'Uploaded '+r.uploaded.length+' file(s)'}
  catch(e){$('upmsg').textContent='Upload failed: '+e.message}
  fi.value=''; loadFiles()}
function exportPdf(){if(cid) location.href=`/api/chats/${cid}/export.pdf`}
$('inp').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
(async()=>{await loadFiles(); const cs=await api('/api/chats'); if(cs.length) openChat(cs[0].id); else loadChats()})();
</script></body></html>
